<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1677ff" />
    <title>标注系统</title>
    <style>
      html, body, #app { height: 100%; margin: 0; padding: 0; }
      #app-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #fff; z-index: 9999; transition: opacity .25s ease;
      }
      #app-loader.hide { opacity: 0; pointer-events: none; }
      .loader-spinner {
        width: 44px; height: 44px; border: 3px solid #e6f4ff; border-top-color: #1677ff;
        border-radius: 50%; animation: loader-spin .8s linear infinite;
      }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app-loader"><div class="loader-spinner"></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.addEventListener('load', () => {
        const l = document.getElementById('app-loader');
        if (l) setTimeout(() => l.classList.add('hide'), 100);
      });
    </script>
  </body>
</html>
